<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stephanie & Daniel - Nuestra Boda</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;900&family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Great+Vibes&display=swap" rel="stylesheet">
    <style>
        :root {
            --wedding-bg: #fdfaf6;
            --wedding-olive: #4a5d23;
            --wedding-terracotta: #b35a44;
            --wedding-dark: #1a1a1a;
        }
        body {
            font-family: 'Inter', sans-serif;
            scroll-behavior: smooth;
            background-color: var(--wedding-bg);
            color: var(--wedding-dark);
        }
        .font-serif {
            font-family: 'Playfair Display', serif;
        }
        .font-signature {
            font-family: 'Great Vibes', cursive;
        }
        .hexagon-mask {
            clip-path: polygon(50% 0%, 93.3% 25%, 93.3% 75%, 50% 100%, 6.7% 75%, 6.7% 25%);
        }
        .diamond-mask {
            clip-path: polygon(50% 0%, 100% 50%, 50% 100%, 0% 50%);
        }
        .glass {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(0,0,0,0.05);
        }
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: var(--wedding-bg);
        }
        ::-webkit-scrollbar-thumb {
            background: var(--wedding-olive);
            border-radius: 10px;
        }
        @keyframes slow-pan {
            from { transform: scale(1) translate(0, 0); }
            to { transform: scale(1.1) translate(-2%, -2%); }
        }
        .animate-slow-pan {
            animation: slow-pan 20s ease-in-out infinite alternate;
        }
    </style>
